<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assessment</title>
    <style>
        body {
            background-color:rgb(153, 204, 50);
            margin: 0;
            padding: 0;
            font-family: sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .logo {
            width: 200px;
            height: 200px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 25px;
        }
        .logo img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
        }

        .content h3 {
            color: white;
            font-size: 1.6rem;
            margin: 0 0 25px 0;
            font-weight: normal;
        }

        button {
            background-color: white;
            color: #8cc63f;
            border: none;
            width: 220px;
            padding: 12px 0;
            font-size: 1.1rem;
            border-radius: 4px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.15);
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="logo">
            <img src="/Users/user/Desktop/summative_test/CSE-JUNE-Summative/assessment/logo & colors/fca-logo.jpg">
        </div>
        <div class="content">
            <h3>Refugee Support Program</h3>
        </div>
        <button onclick="window.location.href='/form'">Register</button>
    </div>

</body>
</html>
